<div class="expense-summary">
  <div class="month-nav">
    <button type="button" class="nav-btn" (click)="previousMonth()" aria-label="Previous month">‹</button>
    <span class="label">{{ monthLabel }} total</span>
    <button type="button" class="nav-btn" (click)="nextMonth()" aria-label="Next month">›</button>
    @if (!isCurrentMonth) {
      <button type="button" class="today-btn" (click)="resetToCurrentMonth()">Today</button>
    }
  </div>
  <span class="amount">{{ monthlyTotal | number: '1.2-2' }}</span>
  <span class="count">({{ monthlyCount }} expense{{ monthlyCount === 1 ? '' : 's' }})</span>
</div>
